# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every pinned version in this repo is covered by one ecosystem below:
#   github-actions  .github/workflows/* — action SHA pins + "# vX.Y.Z" comments,
#                   including the reusable docker/github-builder workflow
#   docker          docker/Dockerfile.dev — FROM lines: the python base image
#                   (tag + digest; patch updates only, because Python follows the
#                   versions Django supports) and the uv image
#   pip             docker/requirements-tools.txt — the global CLIs baked into the
#                   image (pre-commit, watchfiles); project tooling such as ruff or
#                   mypy is pinned by each project, not here
#
# Outside Dependabot (no ecosystem exists): Debian/apt packages (gh, PostgreSQL
# client, …) and the Starship binary. The weekly scheduled rebuild in
# workflows/docker.yml picks up their latest releases instead.
#
# Branch model: every PR targets `develop` (target-branch below); releases
# reach `main` through the develop → main PR. `develop` is also the repository's
# default branch, and GitHub opens *security* update PRs against the default
# branch (target-branch doesn't apply to them) — so those land on `develop` too,
# and the "Dependabot security updates" repository setting is ON.
#
# Review: these PRs wait for the owner's monthly pass (review, let `Lint` and
# `Image tests` run, merge, then release develop → main). The limit of 10
# open PRs per ecosystem keeps Dependabot from pausing while they wait. Nothing is
# ignored: every version is proposed, majors as their own PRs.
#
# Cooldown: a version update is proposed only once the release is 7 days old,
# so a compromised or broken release is usually caught (and yanked) upstream
# before it reaches a PR.
version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    target-branch: "develop"
    rebase-strategy: "auto"
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # ── Docker images (python base + uv) ─────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    target-branch: "develop"
    rebase-strategy: "auto"
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    # Python follows Django, not the other way round: only the Python versions
    # Django officially supports are proposed. Django supports 3.12–3.14, so patch
    # bumps within the pinned minor are welcome and every new minor (3.15, …) is
    # ignored. The weekly drift issue (workflows/dependency-drift.yml) says when
    # Django adds support for a newer Python; then move the FROM line,
    # tests/smoke.sh and the README together, by hand.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      # uv (and any future image) minor + patch land as one PR. Python is
      # excluded so every Python bump gets its own PR, with its own review.
      docker-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "python"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # ── Global CLI tools baked into the image ────────────────────────────
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    target-branch: "develop"
    rebase-strategy: "auto"
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      # Minor + patch across all tools land as one PR; majors arrive alone.
      tools-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

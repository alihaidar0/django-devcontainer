# ============================================================
#  .github/workflows/docker.yml
#
#  Tests, publishes, and scans the dev image on Docker Hub.
#
#  Branch model: topic branches + Dependabot ─PR─▶ develop ─PR─▶ main (no direct pushes).
#  Principle: build and test what you publish. A PR is tested before it merges
#  into develop, and a release run on main tests again right before it publishes,
#  because every build runs `apt-get upgrade` and so picks up Debian packages
#  newer than the ones develop was tested with.
#
#  Jobs:
#    changes      Did the image inputs (docker/, scripts/, tests/,
#                 .dockerignore, this file) change?
#                   PR into develop → the PR's files
#                   push to develop → develop vs main (what the next release adds)
#                   push to main    → this push vs the previous main
#    rebuild-check  Weekly schedule only: is a new image needed? Simulates
#                 `apt-get upgrade` inside the published :latest and compares
#                 the installed Starship with the newest release. The reasons
#                 are written to the job summary.
#    dispatch-build  Weekly schedule only, when rebuild-check found something:
#                 starts this workflow on main (workflow_dispatch, push=true).
#                 Scheduled workflows run from the DEFAULT branch (develop), and
#                 develop never publishes, so the build itself runs on main as
#                 an ordinary manual publish. Nothing changed → nothing starts
#                 and the run finishes green.
#    test         Native build per architecture (amd64 on ubuntu-26.04,
#                 arm64 on ubuntu-26.04-arm — no QEMU) + tests/smoke.sh, then
#                 (amd64) a vulnerability gate: Trivy fails the job on a
#                 CRITICAL finding that has a fix. Accepted findings are
#                 .github/vex.openvex.json and .github/trivy-ignore.rego, each
#                 with its reason. Nothing is pushed.
#    image-tests  "Image tests" — REQUIRED on develop and main. Reports on every
#                 develop push and PR: passes when test passed or was skipped (no
#                 image change), fails otherwise. Status checks attach to the
#                 commit, so the develop → main PR reuses develop's result.
#    reserve-tag  Names the image python-X.Y.Z.R (Python from the Dockerfile
#                 FROM line, R = next free image revision) and creates that git
#                 tag BEFORE anything is pushed, so image, git tag and release
#                 can never disagree. Only from main, when publishing.
#    publish      Docker's official reusable builder (docker/github-builder):
#                 native per-arch builds, multi-arch manifest, SBOM, and a
#                 Sigstore-signed SLSA provenance attestation. Pushes
#                 python-X.Y.Z.R (immutable) plus the moving tags
#                 python-X.Y and latest. Only from main.
#    scan         Trivy scan of the pushed digest → Security tab (informational).
#                 .github/vex.openvex.json marks findings that don't apply
#                 (pinned to one version each, with the reason).
#    release      GitHub Release named after the image tag (release.yml), for
#                 a push to main and for the first image of a new Python
#                 version; other rebuilds only add an image revision.
#
#  Triggers:
#    - Push to develop / PR into develop → changes → test (if image changed)
#                                          → Image tests
#    - Merge develop → main              → changes → test (again, on the exact
#                                          state about to be published) →
#                                          reserve-tag → publish → scan + release
#      (only when image inputs changed; the PR itself reuses develop's green
#      "Image tests", required by the main ruleset, but the image is rebuilt
#      and tested at publish time so the published image is a tested one)
#    - Weekly schedule (Mon 05:00; runs from the default branch, develop)
#                                        → rebuild-check → (only if apt or
#      Starship changed) dispatch-build → [a dispatch run on main:]
#      test → reserve-tag → publish → scan
#      Picks up Debian security fixes, apt packages and Starship even when
#      nothing in the repo changed; it adds the next image revision of the
#      same Python version. A week with nothing new publishes nothing.
#      (GitHub pauses schedules after 60 days without repository activity —
#      re-enable in the Actions tab.)
#    - Manual dispatch on main           → test → reserve-tag → publish
#                                          (toggle) → scan   (the Run workflow
#      dropdown defaults to the default branch: pick main)
#
#  Required GitHub Secrets:
#    DOCKERHUB_USERNAME   Docker Hub username
#    DOCKERHUB_TOKEN      Docker Hub access token (Read, Write & Delete)
#
#  Hardening: actions and the reusable workflow are pinned to full commit
#  SHAs (# vX.Y.Z comment, bumped by Dependabot); explicit runner images;
#  least-privilege permissions; event values reach scripts only via env:.
# ============================================================

name: Docker

# No path filters: "Image tests" must report on every develop commit so the
# develop → main PR can require it; the `changes` job decides what to build.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      push:
        description: "Publish to Docker Hub after the smoke tests pass"
        type: boolean
        default: true
      no_cache:
        description: "Full rebuild — ignore the layer cache"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The weekly schedule runs on develop (the default branch) and gets its own
  # group, so it never cancels, or is cancelled by, a develop push.
  group: docker-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  # A newer develop commit or PR update supersedes the older run; main never cancels.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

env:
  IMAGE_NAME: docker.io/alihaidar199527/django-devcontainer

jobs:

  changes:
    name: Detect image changes
    # Not on the weekly schedule: that run only decides whether to dispatch a build.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # list a PR's changed files
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - name: Did the image inputs change?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          build() { echo "image=$1" >> "$GITHUB_OUTPUT"; echo "image=$1 ($2)"; exit 0; }
          case "$EVENT" in
            pull_request)
              files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename') ;;
            push)
              # develop: everything the next release would add to main.
              # main:    what this merge changed.
              if [ "$REF" = "refs/heads/main" ]; then base="$BEFORE"; else base="main"; fi
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                build true "new branch, no base to compare"
              fi
              files=$(gh api "repos/${REPO}/compare/${base}...${SHA}" --jq '.files[].filename')
              # The compare API lists at most 300 files: assume the image changed beyond that.
              if [ "$(grep -c . <<<"$files")" -ge 300 ]; then build true "300+ files changed"; fi ;;
            *)
              build true "${EVENT} always builds" ;;
          esac
          echo "Changed files:"
          echo "$files"
          if grep -qE '^(docker/|scripts/|tests/|\.dockerignore$|\.github/workflows/docker\.yml$)' <<<"$files"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # Weekly schedule only. Decides whether the published image has gone stale; when
  # it has not, nothing else happens. See scripts/check-rebuild.sh.
  rebuild-check:
    name: Rebuild needed?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Compare the published image with what is available now
        id: check
        env:
          IMAGE: alihaidar199527/django-devcontainer
          GITHUB_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/rebuild-report.md
        run: bash .github/scripts/check-rebuild.sh

      - name: Write job summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/rebuild-report.md
        run: '[ ! -f "$REPORT" ] || cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"'

  # Scheduled workflows run from the default branch (develop), which never
  # publishes. When the check found something, start the ordinary build on main:
  # a workflow_dispatch from the workflow token is allowed to start a run.
  dispatch-build:
    name: Start the rebuild on main
    needs: rebuild-check
    if: needs.rebuild-check.outputs.rebuild == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run the Docker workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run docker.yml --ref main -f push=true
          echo "Started a Docker run on main (push=true): see the Actions tab." >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (${{ matrix.arch }})
    needs: changes
    # Also on a push to main: the release rebuilds the image with the newest Debian
    # packages, so it is tested again before it is published. Not on the weekly
    # schedule (changes is skipped there): the dispatched run on main does the build.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: django-devcontainer:test
          cache-from: type=gha,scope=test-${{ matrix.arch }}
          cache-to: type=gha,scope=test-${{ matrix.arch }},mode=max
          no-cache: ${{ inputs.no_cache == true }}

      - name: Smoke test
        run: docker run --rm -v "$PWD/tests:/tests:ro" django-devcontainer:test bash /tests/smoke.sh

      # Gate before anything is published: a CRITICAL finding that already has a fix
      # fails the job (and with it the required "Image tests" check). Everything else
      # stays informational in the post-publish scan. Accepted findings live in the
      # VEX file and the ignore policy, each with its reason. One architecture is
      # enough: the packages are the same.
      - name: Vulnerability gate (CRITICAL with a fix)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .github/vex.openvex.json
        with:
          image-ref: django-devcontainer:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          ignore-policy: .github/trivy-ignore.rego
          exit-code: "1"

  # The required status check. A matrix job skipped by `if` reports an
  # unexpanded name, so the per-arch checks can't be required directly.
  image-tests:
    name: Image tests
    needs: [changes, test]
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          IMAGE: ${{ needs.changes.outputs.image }}
        run: |
          echo "changes=${CHANGES} image=${IMAGE} test=${TEST}"
          if [ "$CHANGES" != "success" ]; then echo "❌ change detection failed"; exit 1; fi
          case "$TEST" in
            success) echo "✅ image built and smoke-tested on amd64 + arm64" ;;
            skipped) echo "✅ no image inputs changed — nothing to test" ;;
            *)       echo "❌ image tests: ${TEST}"; exit 1 ;;
          esac

  # Every published image gets a permanent python-X.Y.Z.R name: X.Y.Z is the Python
  # release in the Dockerfile's FROM line and R is the image revision of that
  # release. R is the first number that is free on Docker Hub AND for which GitHub
  # lets the git tag be created (a name used by an immutable release stays reserved
  # for good, even after the release was deleted). The tag is created here, before
  # anything is pushed, so the image, the git tag and the release never disagree.
  # The dotted numeric form lets Dependabot in consuming repositories order and
  # bump it. This job holds the publish conditions; later jobs follow its result.
  reserve-tag:
    name: Reserve image tag
    needs: [changes, test]
    # Only from main, and only after `test` passed in this same run: a push that
    # changed the image inputs, or a dispatch (manual, or started by the weekly check).
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && needs.changes.outputs.image == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.push))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Creating the git tag is the only reason for contents: write; no secret is used.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      revision: ${{ steps.revision.outputs.number }}
      python_version: ${{ steps.python.outputs.version }}
      python_line: ${{ steps.python.outputs.line }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docker/Dockerfile.dev
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The base image is pinned by digest, so the FROM line names the exact
      # Python the image contains.
      - name: Read the Python version
        id: python
        run: |
          version="$(grep -oE '^FROM python:[0-9]+\.[0-9]+\.[0-9]+' docker/Dockerfile.dev | head -1 | cut -d: -f2)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the Python version from the FROM line in docker/Dockerfile.dev (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "line=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Pick the next free revision and reserve its git tag
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: alihaidar199527/django-devcontainer
          PYTHON_VERSION: ${{ steps.python.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: bash .github/scripts/reserve-tag.sh

  publish:
    name: Publish
    needs: reserve-tag
    # reserve-tag carries the publish conditions; it is skipped when nothing
    # should be published, and a skipped need skips this job too.
    if: ${{ !cancelled() && needs.reserve-tag.result == 'success' }}
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write   # keyless (Sigstore) signing of the provenance attestation
    with:
      output: image
      push: true
      context: .
      file: docker/Dockerfile.dev
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-26.04
        linux/arm64=ubuntu-26.04-arm
      cache: ${{ inputs.no_cache != true }}
      cache-mode: max
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: docker.io/alihaidar199527/django-devcontainer
      # python-X.Y.Z.R  immutable: Python X.Y.Z, image revision R (reserved above)
      # python-X.Y      moving: newest image of that Python line
      # latest          moving: newest image
      # The commit that built an image is not a tag: it is in the image's
      # org.opencontainers.image.revision label and in the job summary.
      # `latest` is tied to the publish branch, not to the repository's default
      # branch, so changing the default branch can never stop or redirect it.
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=${{ needs.reserve-tag.outputs.tag }}
        type=raw,value=python-${{ needs.reserve-tag.outputs.python_line }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    name: Scan
    needs: publish
    # Explicit condition: the default success() would skip this job after any skipped
    # upstream job; this one needs only a successful publish.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to the Security tab
    steps:
      # For .github/vex.openvex.json and .github/trivy-ignore.rego — the image
      # itself is scanned by digest.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Informational only (exit-code 0): a dev image intentionally carries
      # compilers and headers, so findings are tracked in Security → Code
      # scanning instead of blocking the publish.
      # TRIVY_VEX: version-pinned not_affected statements for packages that
      # appear only in SBOM files shipped inside pip and virtualenv (bundled or
      # embedded copies, not installed packages). The reasons are in the file.
      # ignore-policy: drops whole packages that cannot affect a container
      # (linux-libc-dev, the kernel headers); the reason is in the file.
      # limit-severities-for-sarif: without it the SARIF output ignores `severity`
      # and every fixable Medium/Low finding becomes a Code scanning alert too.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: .github/vex.openvex.json
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          ignore-policy: .github/trivy-ignore.rego
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif

      - name: Write job summary
        if: always()
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          META_JSON: ${{ needs.publish.outputs.meta-json }}
          SIGNED: ${{ needs.publish.outputs.signed }}
          VERIFY: ${{ needs.publish.outputs.cosign-verify-commands }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## 🐳 Published dev image"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${IMAGE_NAME}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Tags** | $(jq -r '[.tags[] | "`" + . + "`"] | join(" ")' <<<"$META_JSON") |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Provenance signed** | \`${SIGNED}\` |"
            echo "| **Triggered by** | \`${EVENT}\` |"
            echo "| **Commit** | \`${SHA}\` |"
            echo ""
            echo "### Verify the signed provenance"
            echo '```bash'
            echo "$VERIFY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub Release is named after the image it describes (python-X.Y.Z.R) and is
  # created from the git tag reserved above. It is created for every push to main
  # that changes the image and for the first image of a new Python version (revision
  # 1, from the weekly rebuild or a manual run); other rebuilds only add a revision.
  release:
    name: Release
    needs: [reserve-tag, publish]
    if: >-
      !cancelled() &&
      needs.publish.result == 'success' &&
      (github.event_name == 'push' || needs.reserve-tag.outputs.revision == '1')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.reserve-tag.outputs.tag }}
      python_version: ${{ needs.reserve-tag.outputs.python_version }}
      image: alihaidar199527/django-devcontainer
      digest: ${{ needs.publish.outputs.digest }}
